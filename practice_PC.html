<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	
<!-- AOS CSS/JS 스크롤 애니메이션 효과-->
<!-- https://michalsnik.github.io/aos/ 에서 효과 확인-->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

	
<!-- Swiper CSS/JS 스와이프 효과-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

<!-- 프리텐다드 서체 -->	
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
	
<!-- 구글 심볼 -->	
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	
	
	
<title>PC</title>
	
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}	
img {
    display: block;
	/* video도 블록요소로 만들기 */
}
a {color: inherit; text-decoration: none;}
ul, ol, li {margin: 0; padding: 0; list-style: none;}
p {text-align: center; font-size: 30px; font-weight: 600; padding: 30px 0px; color: #5B6ACE;}
	
/* 스크롤 부드럽게 */
html{scroll-behavior:smooth;}
	
/* ================= 구글 심볼 ================= */
.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24;
}	
	
/* ================= 프로모션 ================= */
.promotion_pc {
    width: 1420px;
    min-width: 1420px;
	height: 5000px;
    margin: 0 auto;
    position: relative; 
	/* relative는 원래 위치를 기준으로 배치 */
	/* absolute는 조상 요소를 기준으로 배치 > 원래 위치 잃어버림 */
	overflow: hidden;
	background-color: #f5f5f5;
}
	
	
	
/* ================= 이미지 반복 ================= */
.film_wrap_ver1 {
  position: relative;
  width: 1420px; height: 200px;
  margin-top: 30px; margin-bottom: 50px;
  background: url("ex_img/PC_rolling.png") repeat-x;
	/* 배경 이미지를 가로 방향으로 반복 */
  animation: rolling 20s linear infinite;
	/* 실행할 애니메이션 이름 rolling */
}
	
.film_wrap_ver2 {
  display: flex;
  align-items: center;
  position: relative;
  width: 1420px; height: 300px;
  background: url("ex_img/PC_rolling_bg.jpg");
}
.rolling_bg {
  width: 100%;
  height: 200px;
  background-image: url("ex_img/PC_rolling.png");
  background-repeat: repeat-x;
  animation: rolling 50s linear infinite;
}
	/* from > 애니메이션 시작 지점
	   to >  애니메이션 종료 지점 > 왼쪽으로 -2180px 이동
	   실행할 png 이미지의 너비로 설정정 */

@keyframes rolling {
  from { background-position: 0 0; }
  to { background-position: -1620px 0; }
}
	/* from > 애니메이션 시작 지점
	   to >  애니메이션 종료 지점 > 왼쪽으로 -2180px 이동
	   실행할 png 이미지의 너비로 설정정 */
	

	
	
/* ================= Fade up ================= */
.fade_wrap {position: relative;}

/* 배경 이미지 */
.fade_bg {
    display: block;
    width: 100%;
    height: auto;
}
/* 움직이는 이미지 */
#id-fade-up {
    position: absolute;
    /* top: 0; left: 0; width: 100%; 배경과 fae-up되는 이미지 크기가 같을 경우 제거 가능 */
    display: block;
}
	
	
	
/* ================= Img blur + hover ================= */
.blur-hover-section{
	width: 100%; height: 500px;
	display: flex; justify-content: center; align-items: center;
	background-color: #5B6ACE;
}
.blur-hover-img-box{
	width: 800px; height: 400px;
	overflow: hidden;
}
.image-card{
	position: relative;
}
.image{
	display: block;
	filter: blur(20px);
	transition: filter 1.5s ease-in-out, transform 0.5s ease-in-out;
}
.blur-hover-img-box.active .image{
  filter: blur(0);
  transform: scale(1);
}
.image-card:hover .image{
  transform: scale(1.05);
}
.overlay-text{
  position:absolute; right:0px; bottom:0px;
  background:rgba(0,0,0,0.5);
  color:#fff;
  padding:12px 20px;
  font-size:14px;
  transition: background 0.6s ease-in-out;
}
.image-card:hover .overlay-text{
  	background:rgba(0,0,0,0.80);
}
	
	
	
	
/* ================= Img Slide ================= */
.slide_wrap {
  position: relative;
  width: 1420px; height: 600px;
  overflow: hidden;
background: url("ex_img/PC_slide_bg.jpg") center center / cover no-repeat;
}
.card {
  position: absolute;
  top: 50%; left: 50%;
  width: 280px; height: 360px;
  opacity: 0;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  transform: translate(-50%, -50%);
  transition: all 0.8s ease;
}
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* 왼쪽 */
.card.left {
  opacity: 1;
  transform: translate(-50%, -50%) translateX(-120%);
}
/* 중앙 */
.card.center {
  width: 350px;  height: 450px;
  opacity: 1;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
  transform: translate(-50%, -50%);
  z-index: 2;
}
/* 오른쪽 */
.card.right {
  opacity: 1;
  transform: translate(-50%, -50%) translateX(120%);
}
	
</style>
	
</head>

<body>
	
<!-- ================= 프로모션 페이지 시작 ================= -->
<div class="promotion_pc">

<!-- ======== 이미지 ======== -->
<div><img src="ex_img/PC_banner_1420.jpg" alt="이미지"></div>
	
	
	
	
<p>Rolling</p>
	
<!-- ======== 이미지 반복 ======== -->
<div class="film_wrap_ver1"></div> 
	
<div class="film_wrap_ver2">
	<div class="rolling_bg"></div>
</div> 

	
	
	
<p>Fade up</p>
<!-- ======== 이미지 위로 쏙 ======== -->
<div>
    <!-- fade-up 되는 이미지 -->
	<!--
		data-aos-offset : 스크롤 기준점
		data-aos-delay : 애니메이션 시작 전 대기 시간
		data-aos-duration : 애니메이션 진행 시간
		data-aos-once : false는 반복 true는 한 번
	-->
    <div
        data-aos="fade-up"
        data-aos-offset="300"
        data-aos-delay="0"
        data-aos-duration="1000"
        data-aos-easing="ease-in-out"
        data-aos-once="false"
    >
        <img
            src="ex_img/PC_fade_up.png"
            id="id-fade-up"
			usemap="#fade-up-map"
        >
		<!-- 이미지에 링크 연결
			usemap과 map name과 일치해야함
			map name과 id는 달라도 됨 -->
		<map name="fade-up-map" id="fade-up-area">
	      <area shape="rect" coords="424,45,605,256" href="https://www.naver.com/" alt="첫번째 영역"/>
		  <area shape="rect" coords="619,45,798,255" href="https://www.naver.com/" alt="두번째 영역"/>
		  <area shape="rect" coords="817,43,994,258" href="https://www.naver.com/" alt="세번째 영역"/>
		</map>
    </div>
	
    <!-- 배경 이미지 -->
    <img
        src="ex_img/PC_fade_up_bg.jpg"
        class="fade_bg"
    >
</div>
	
	
	
	
<p>Img scroll-blur + hover</p>
<!-- ======== 이미지 스크롤 블러, 오버시 확대 ======== -->
	
<div class="blur-hover-section">
	<div class="blur-hover-img-box scroll-blur"> 
		<a href="https://www.naver.com/" class="image-card">
			<img src="ex_img/PC_hover.jpg" alt="이미지" class="image">
			<div class="overlay-text">VIEW MORE →</div>
		</a>
	</div>
</div>
	
	
	
<p>Img slide</p>
<!-- ======== 이미지 슬라이드 ======== -->
<div class="slide_wrap">
  <div class="card"><img src="ex_img/PC_slide_wrap_01.jpg"></div>
  <div class="card"><img src="ex_img/PC_slide_wrap_02.jpg"></div>
  <div class="card"><img src="ex_img/PC_slide_wrap_03.jpg"></div>
  <div class="card"><img src="ex_img/PC_slide_wrap_04.jpg"></div>
  <div class="card"><img src="ex_img/PC_slide_wrap_05.jpg"></div>
  <div class="card"><img src="ex_img/PC_slide_wrap_06.jpg"></div>
</div>
	
	
<!-- ================= 프로모션 페이지 끝 ================= -->
</div> 
	
	
	
	
<!-- ======== 가져온 애니메이션 기능을 실행할 수 있도록 초기화 ======== -->
<script>
    AOS.init();
</script>

	
	
<script>
// scroll-blur 적용
const targets = document.querySelectorAll(".scroll-blur");
const observerBlur = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add("active");
    }
  });
},{threshold:0.5}); // 이미지 영역이 화면에 50% 이상 들어오면 active 클래스 실행
targets.forEach(el => observerBlur.observe(el));
	
	
	
// slide-wrap 적용
const cards = document.querySelectorAll('.card'); // querySelectorAll('.card') : HTML에서 class가 card인 요소를 모두 가져와
const total = cards.length; // cards.length : 가져온 카드의 총 개수를 계산해.
let index = 1; // index는 현재 중앙에 위치할 카드의 번호 / 1번카드 0, 2번카드 1, 2번카드 2 ...
function slide() {
  cards.forEach((card, i) => {
    card.className = 'card';

    let pos = (i - index + total) % total; 
	// pos : 현재 카드가 중앙을 기준으로 어느 위치에 있는지 계산

    if (pos === 0) card.classList.add('center');
    else if (pos === 1) card.classList.add('right');
    else if (pos === total - 1) card.classList.add('left');
  });

  index = (index + 1) % total; // 현재 중앙에 있는 카드 번호를 1씩 증가
}

slide();
setInterval(slide, 3000); // 3초마다 중앙 카드가 다음 카드로 바뀌는 구조

</script>
	
</body>
</html>
