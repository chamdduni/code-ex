<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	
<!-- AOS CSS/JS 스크롤 애니메이션 효과-->
<!-- https://michalsnik.github.io/aos/ 에서 효과 확인-->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<!-- Swiper CSS/JS 스와이프 효과-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

<!-- 프리텐다드 서체 -->	
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
	
<!-- 구글 심볼 -->	
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	
	
	
<title>PC</title>
	
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
	
img {
    display: block;
	/* video도 블록요소로 만들기 */
}
a {color: inherit; text-decoration: none;}
ul, ol, li {margin: 0; padding: 0; list-style: none;}
p {text-align: center; font-size: 20px; font-weight: 600; padding-top:50px;}
	
	
/* ================= 구글 심볼 ================= */
.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24;
}	
	
/* ================= 프로모션 ================= */
.promotion_pc {
    width: 1420px;
    min-width: 1420px;
    margin: 0 auto;
    position: relative; 
	/* relative는 원래 위치를 기준으로 배치 */
	/* absolute는 조상 요소를 기준으로 배치 > 원래 위치 잃어버림 */
	overflow: hidden;
	background-color: #f5f5f5;
}
	
/* ================= 이미지 반복 ================= */
.film_wrap_ver1 {
  position: relative;
  width: 1420px; height: 200px;
  margin-top: 50px; margin-bottom: 50px;
  background: url("ex_img/PC_flim_moving.png") repeat-x;
	/* 배경 이미지를 가로 방향으로 반복 */
  animation: move 30s linear infinite;
	/* 실행할 애니메이션 이름 move */
}
	
.film_wrap_ver2 {
  display: flex;
  align-items: center;
  position: relative;
  width: 1420px; height: 400px;
  background: url("ex_img/PC_flim_moving_bg.jpg");
}
.moving_bg {
  width: 100%;
  height: 200px;
  background-image: url("ex_img/PC_flim_moving.png");
  background-repeat: repeat-x;
  animation: move 30s linear infinite;
}
	/* from > 애니메이션 시작 지점
	   to >  애니메이션 종료 지점 > 왼쪽으로 -2180px 이동
	   실행할 png 이미지의 너비로 설정정 */

@keyframes move {
  from { background-position: 0 0; }
  to { background-position: -2180px 0; }
}
	/* from > 애니메이션 시작 지점
	   to >  애니메이션 종료 지점 > 왼쪽으로 -2180px 이동
	   실행할 png 이미지의 너비로 설정정 */
	
	
	
	
</style>
	
</head>

<body>
	
<!-- ================= 프로모션 페이지 시작 ================= -->
<div class="promotion_pc">

<!-- ======== 이미지 ======== -->
<div><img src="ex_img/pc_top_1420.jpg" alt="이미지"></div>
	
	
<p>이미지 반복</p>
	
<!-- ======== 이미지 반복 ======== -->
<div class="film_wrap_ver1"></div> 
	
<div class="film_wrap_ver2">
	<div class="moving_bg"></div>
</div> 
	
	
<!-- ================= 프로모션 페이지 끝 ================= -->
</div> 

</body>
</html>
