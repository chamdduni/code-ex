<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

	
<title>index</title>
	
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

a {
  color: inherit;
  text-decoration: none;
}

html, body {
  width: 100%;
  height: 100%;
}

.container {
  width: 100%;
  height: 100%;
  margin: 0 auto;
  background-color: #333;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}

.btn {
  width: 150px;
  height: 50px;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 4px;
  background-color: #5B6ACE;
  color: #fff; /* 텍스트 컬러 */
  cursor: pointer;
  transition:
    background-color 0.5s ease,
    transform 0.5s ease;
}
/* Hover */
.btn:hover {
  background-color: #4556C0;
  color: #fff;
  transform: translateY(-5px);
}
</style>

<body>
  <div class="container">
    <a href="practice_PC.html" class="btn">PC</a>
    <a href="practice_MO.html" class="btn">MO</a>
  </div>
</body>
	
	
</html>
